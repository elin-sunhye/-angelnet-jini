<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>업무 수정</title>
    <link rel="stylesheet" href="./css/comp-style.css" />
    <link rel="stylesheet" href="./css/work.css" />
    <script src="./js/jquery.3.1.1.js"></script>
    <script src="./js/common.js"></script>
    <script src="./js/work.js"></script>
  </head>
  <body>
    <!-- 헤더 컴포넌트 -->
    <div id="compHeader" data-title="일정 수정"></div>

    <div class="wrap flex">
      <!-- 페이지 내용 -->
      <div id="container" class="modify flex">
        <div class="title_wrap flex">
          <div class="btn_box flex">
            <button
              type="button"
              class="btn_save"
              onclick="location.href = './work.html'"
            >
              저장
            </button>
            <button type="button" class="btn_cancel" onclick="history.back()">
              취소
            </button>
          </div>
        </div>

        <!--  폼 -->
        <form>
          <div class="row">
            <div class="col flex">
              <label for="biz">업체</label>
              <div class="inp_box search_pop_up flex">
                <input type="text" name="bizNm" title="업체명" readonly />
                <button
                  type="button"
                  class="btn_open_popup"
                  aria-label="팝업 열기"
                >
                  <img src="./img/ico-search.svg" alt="" />
                </button>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col flex">
              <label for="title">제목</label>
              <div class="inp_box">
                <input
                  type="text"
                  id="title"
                  name="title"
                  placeholder="제목을 입력하세요"
                />
              </div>
            </div>
          </div>

          <div class="row flex">
            <div class="col flex">
              <label for="date">날짜</label>
              <div class="inp_box">
                <input type="date" id="date" name="date" />
              </div>
            </div>
            <div class="col flex">
              <label for="time">시간</label>
              <div class="inp_box">
                <input type="time" id="time" name="time" />
              </div>
            </div>
            <div class="col flex">
              <label for="category">구분</label>
              <div class="select_box">
                <select name="category" title="구분 선택">
                  <option value="1" selected>방문</option>
                  <option value="2">상담</option>
                </select>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col flex">
              <label for="addr">주소</label>
              <div class="inp_box">
                <input type="text" id="addr" name="addr" />
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col flex">
              <label for="remark">업무내용</label>
              <textarea name="remark"></textarea>
            </div>
          </div>
        </form>

        <!-- 텝 컴포넌트 -->
        <div id="compTab" data-tab-src="./data/days.json"></div>

        <!-- 탭 내용 -->
        <div class="tab_content_wrap">
          <div class="tab_content" data-tab-content="01"></div>
          <div class="tab_content" data-tab-content="02"></div>
          <div class="tab_content" data-tab-content="03"></div>
          <div class="tab_content" data-tab-content="04"></div>
          <div class="tab_content" data-tab-content="05"></div>
        </div>

        <!-- 팝업 -->
        <div id="compPopupBizList"></div>
      </div>
    </div>

    <!-- 네비게이션 컴포넌트 -->
    <div id="compNav"></div>
  </body>
</html>
