<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>신규 업체 기안서 수정</title>
    <link rel="stylesheet" href="./css/comp-style.css" />
    <link rel="stylesheet" href="./css/approval.css" />
    <script src="./js/jquery.3.1.1.js"></script>
    <script src="./js/common.js"></script>
    <script src="./js/approval.js"></script>
  </head>
  <body>
    <!-- 헤더 컴포넌트 -->
    <div id="compHeader" data-title="기안서 수정"></div>

    <div class="wrap flex">
      <!-- 페이지 내용 -->
      <div id="container" class="request new-vendor flex">
        <div class="title_wrap flex">
          <h6 class="title flex">신규 업체 기안서</h6>
          <div class="btn_box flex">
            <button type="button" class="btn_regist">결재</button>
            <button
              type="button"
              class="btn_modify"
              onclick="location.href = './approval.html'"
            >
              등록
            </button>
            <button type="button" class="btn_del">삭제</button>
          </div>
        </div>

        <!-- 등록 폼 -->
        <form>
          <h6 class="sec_title">기본정보</h6>
          <div class="row flex">
            <div class="col flex">
              <label for="date">날짜</label>
              <div class="inp_box">
                <input type="date" id="date" name="date" />
              </div>
            </div>
            <div class="col flex">
              <label for="category">구분</label>
              <div class="select_box">
                <select name="category" title="구분 선택">
                  <option value="1" selected>지급</option>
                  <option value="2">회수</option>
                </select>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col flex">
              <label for="title">제목</label>
              <div class="inp_box">
                <input
                  type="text"
                  id="title"
                  name="title"
                  placeholder="제목을 입력하세요"
                />
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col flex">
              <label for="biz">업체</label>
              <div class="inp_box search_pop_up flex">
                <input type="text" name="bizNm" title="업체명" readonly />
                <button
                  type="button"
                  class="btn_open_popup"
                  aria-label="팝업 열기"
                >
                  <img src="./img/ico-search.svg" alt="" />
                </button>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col flex">
              <label for="biz">사업자번호</label>
              <div class="inp_box search_pop_up flex">
                <input type="number" name="bizNo" title="사업자번호" />
                <button
                  type="button"
                  class="btn_open_popup btn_biz_check"
                  aria-label="팝업 열기"
                >
                  휴폐업 검색
                </button>
              </div>
            </div>
          </div>

          <div class="row flex">
            <div class="col flex">
              <label for="bizStatus">업태</label>
              <div class="inp_box">
                <input type="text" name="bizStatus" title="업태" />
              </div>
            </div>

            <div class="col flex">
              <label for="bizType">종목</label>
              <div class="inp_box">
                <input type="text" name="bizType" title="종목" />
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col flex">
              <label for="addr">주소</label>
              <div class="inp_box search_pop_up flex">
                <input type="text" name="addr" title="주소" />
                <button
                  type="button"
                  class="btn_open_popup btn_addr"
                  aria-label="팝업 열기"
                >
                  주소 검색
                </button>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col flex">
              <label for="addrDtl">상세주소</label>
              <div class="inp_box">
                <input type="text" name="addrDtl" title="상세주소" />
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col flex">
              <label for="floors">층수</label>
              <div class="inp_box flex">
                <input type="number" name="floors" title="층수" />
                <span>층</span>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col flex">
              <label for="ceo">대표자</label>
              <div class="inp_box">
                <input type="text" name="ceo" title="대표자" />
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col flex">
              <label for="ceoNo">휴대폰번호</label>
              <div class="inp_box">
                <input type="number" name="ceoNo" title="휴대폰번호" />
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col flex">
              <label for="ceoEMail">E-MAIL</label>
              <div class="inp_box">
                <input type="email" name="ceoEMail" title="E-MAIL" />
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col flex">
              <label for="ceoAddr">자택 주소</label>
              <div class="inp_box search_pop_up flex">
                <input type="text" name="ceoAddr" title="자택 주소" />
                <button
                  type="button"
                  class="btn_open_popup btn_addr"
                  aria-label="팝업 열기"
                >
                  주소 검색
                </button>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col flex">
              <label for="administrator">실제 운영자</label>
              <div class="inp_box">
                <input type="text" name="administrator" title="실제 운영자" />
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col flex">
              <label for="administratorNo">휴대폰번호</label>
              <div class="inp_box">
                <input type="number" name="administratorNo" title="휴대폰번호" />
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col flex">
              <label for="administratorEMail">E-MAIL</label>
              <div class="inp_box">
                <input type="email" name="administratorEMail" title="E-MAIL" />
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col flex">
              <label for="administratorAddr">자택 주소</label>
              <div class="inp_box search_pop_up flex">
                <input type="text" name="administratorAddr" title="자택 주소" />
                <button
                  type="button"
                  class="btn_open_popup btn_addr"
                  aria-label="팝업 열기"
                >
                  주소 검색
                </button>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col flex">
              <label for="manager">업장 매니저</label>
              <div class="inp_box">
                <input type="text" name="manager" title="업장 매니저" />
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col flex">
              <label for="managerNo">휴대폰번호</label>
              <div class="inp_box">
                <input type="number" name="managerNo" title="휴대폰번호" />
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col flex">
              <label for="managerEMail">E-MAIL</label>
              <div class="inp_box">
                <input type="email" name="managerEMail" title="E-MAIL" />
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col flex">
              <label for="managerAddr">자택 주소</label>
              <div class="inp_box search_pop_up flex">
                <input type="text" name="managerAddr" title="자택 주소" />
                <button
                  type="button"
                  class="btn_open_popup btn_addr"
                  aria-label="팝업 열기"
                >
                  주소 검색
                </button>
              </div>
            </div>
          </div>

          <h6 class="sec_title">거래 조건</h6>
          <div class="row">
            <div class="col flex">
              <label for="openDate">오픈 예정일</label>
              <div class="inp_box">
                <input type="date" id="openDate" name="openDate" />
              </div>
            </div>
          </div>

          <div class="row flex">
            <div class="col flex">
              <label for="area">실평수</label>
              <div class="inp_box flex">
                <input type="number" name="area" title="실평수" />
                <span>평</span>
              </div>
            </div>

            <div class="col flex">
              <label for="table">테이블 수</label>
              <div class="inp_box flex">
                <input type="number" name="table" title="테이블 수" />
                <span>개</span>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col flex">
              <label for="keyProducts">주력품목</label>
              <div class="inp_box">
                <input type="text" id="keyProducts" name="keyProducts" />
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col flex">
              <label for="keyMenus">주력메뉴</label>
              <div class="inp_box">
                <input type="text" id="keyMenus" name="keyMenus" />
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col flex">
              <label for="cost">예상수익</label>
              <div class="inp_box">
                <input type="number" id="cost" name="cost" min="0" />
              </div>
            </div>
          </div>

          <div class="row flex">
            <div class="col flex">
              <label for="termsOfTrade">거래조건</label>
              <div class="check_box flex">
                <label class="check_item">
                  <input type="checkbox" name="termsOfTrade" value="loan" />
                  <span>대여금</span>
                </label>
                <label class="check_item">
                  <input type="checkbox" name="termsOfTrade" value="freezer" />
                  <span>냉동고</span>
                </label>
                <label class="check_item">
                  <input type="checkbox" name="termsOfTrade" value="fridge" />
                  <span>냉장고</span>
                </label>
                <label class="check_item">
                  <input type="checkbox" name="termsOfTrade" value="etc" />
                  <span>기타</span>
                </label>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col flex">
              <label for="supportMaterials">지원기자재</label>
              <div class="inp_box">
                <input type="text" id="supportMaterials" name="supportMaterials" />
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col flex">
              <label for="supportEtc">기타지원</label>
              <div class="inp_box">
                <input type="text" id="supportEtc" name="supportEtc" />
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col flex">
              <label for="loan">대여금</label>
              <div class="inp_box">
                <input type="number" id="loan" name="loan" min="0" />
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col flex">
              <label for="supportDate">초기지원일</label>
              <div class="inp_box">
                <input type="date" id="supportDate" name="supportDate" />
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col flex">
              <label for="expirDate">만기일</label>
              <div class="inp_box">
                <input type="date" id="expirDate" name="expirDate" />
              </div>
            </div>
          </div>

          <div class="row flex">
            <div class="col flex">
              <label for="repayments">상환횟수</label>
              <div class="inp_box flex">
                <input type="number" name="repayments" title="상환횟수" />
                <span>회</span>
              </div>
            </div>

            <div class="col flex">
              <label for="monthly">투입비용회수기간(대여금 제외)</label>
              <div class="inp_box flex">
                <input type="number" name="monthly" title="투입비용회수기간" />
                <span>개월</span>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col flex">
              <label for="monthlyAmount">월상환액</label>
              <div class="inp_box">
                <input type="number" name="monthlyAmount" title="월상환액" />
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col flex">
              <label for="payMethod">결재 조건</label>
              <div class="select_box">
                <select name="payMethod" title="결재 조건 선택">
                  <option value="1" selected>현금</option>
                  <option value="2">카드</option>
                </select>
              </div>
            </div>
          </div>

          <div class="row flex">
            <div class="col flex">
              <label for="payMethod">결재 방법</label>
              <div class="select_box">
                <select name="payMethod" title="결재 방법 선택">
                  <option value="1" selected>현금</option>
                  <option value="2">카드</option>
                </select>
              </div>
            </div>

            <div class="col flex">
              <label for="shipping">배송담당</label>
              <div class="inp_box">
                <input type="text" name="shipping" title="배송담당" />
              </div>
            </div>
          </div>

          <h6 class="sec_title">이전 거래</h6>
            <div class="row">
              <div class="col flex">
                <label for="prevWholesaler">이전도매사</label>
                <div class="inp_box">
                  <input type="text" name="prevWholesaler" title="이전도매사" />
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col flex">
                <label for="prevLoan">이전대여금</label>
                <div class="inp_box">
                  <input type="text" name="prevLoan" title="이전대여금" />
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col flex">
                <label for="prevSupportMaterials">이전지원품</label>
                <div class="inp_box">
                  <input type="text" name="prevSupportMaterials" title="이전지원품" />
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col flex">
                <label for="tradingRoute">거래루트</label>
                <div class="inp_box">
                  <input type="text" name="tradingRoute" title="거래루트" />
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col flex">
                <label for="ect">기타</label>
                <div class="inp_box">
                  <input type="text" name="ect" title="기타" />
                </div>
              </div>
            </div>

          <h6 class="sec_title">상권 분석</h6>
          <div class="row">
            <div class="col flex">
              <label for="surroundingArea">주변상권</label>
              <textarea name="surroundingArea"></textarea>
            </div>
          </div>

          <div class="row">
            <div class="col flex">
              <label for="bizAnalysis">업소분석</label>
              <textarea name="bizAnalysis"></textarea>
            </div>
          </div>

          <div class="row">
            <div class="col flex">
              <label for="remakr">거래의견</label>
              <textarea name="remakr"></textarea>
            </div>
          </div>

          <div class="row">
            <div class="col">
              <input type="file" id="cost" name="cost" min="0" />
            </div>
          </div>
        </form>
        
        <!-- TIP -->
        <div class="tip_box">
          <P>** 신규 거래가 확정되면 대여금 및 기자재 기안서는 별도 작성하여 처리해야합니다. (ERP에 업체 등록 확인 후 작성)</P>
          <p>신규 거래용 첨부자료</p>
          <ul>
            <li>1. 사업자 사본</li>
            <li>2. 대표자 신분증</li>
            <li>3. 거래 약정서</li>
            <li>4. 기자재 약정서</li>
            <li>5. 대여금 약정서</li>
          </ul>
        </div>

        <!-- 팝업 -->
        <div id="compPopupBizList"></div>
      </div>
    </div>

    <!-- 네비게이션 컴포넌트 -->
    <div id="compNav"></div>
  </body>
</html>
