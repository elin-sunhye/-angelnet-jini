<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>홈</title>
    <link rel="stylesheet" href="./css/comp-style.css" />
    <link rel="stylesheet" href="./css/home.css" />
    <script src="./js/jquery.3.1.1.js"></script>
    <script src="./js/common.js"></script>
    <script src="./js/home.js"></script>
  </head>
  <body>
    <!-- 헤더 컴포넌트 -->
    <div id="compHeader"></div>

    <div class="wrap flex">
      <!-- 페이지 내용 -->
      <div id="container" class="flex">
        <!-- MY 일정 -->
        <div id="compMyPlan"></div>

        <div>
          <h6 class="title flex">
            <span>
              <img src="./img/ico-plan.svg" alt="마이 일정 아이콘" />
            </span>
            전체 일정
          </h6>
          <ul class="cont_box flex plan">
            <li>
              <p>
                <span>09:00</span>
                백가 식당 냉동고 추가 지급
              </p>
              <span class="chip visit">방문</span>
            </li>
            <li>
              <p>
                <span>10:40</span>
                맛나 식당 냉장고 * 3 추가 지급
              </p>
              <span class="chip visit">방문</span>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <!-- 네비게이션 컴포넌트 -->
    <div id="compNav"></div>
  </body>
</html>
