<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>업무</title>
    <link rel="stylesheet" href="./css/comp-style.css" />
    <link rel="stylesheet" href="./css/work.css" />
    <script src="./js/jquery.3.1.1.js"></script>
    <script src="./js/common.js"></script>
    <script src="./js/work.js"></script>
  </head>
  <body>
    <!-- 헤더 컴포넌트 -->
    <div id="compHeader"></div>

    <div class="wrap flex">
      <!-- 페이지 내용 -->
      <div id="container" class="flex">
        <div class="title_wrap flex">
          <h6 class="title flex">
            <span>
              <img src="./img/ico-calendar.svg" alt="전체 일정 아이콘" />
            </span>
            2026년 4월
          </h6>
          <div class="btn_box flex">
            <button
              type="button"
              class="btn_regist"
              onclick="location.href = './request-work.html'"
            >
              등록
            </button>
            <button
              type="button"
              class="btn_modify"
              onclick="location.href = './modify-work.html'"
            >
              수정
            </button>
            <button type="button" class="btn_del">삭제</button>
          </div>
        </div>

        <!-- 텝 컴포넌트 -->
        <div id="compTab" data-tab-src="./data/days.json"></div>

        <!-- 탭 내용 -->
        <div class="tab_content_wrap">
          <div class="tab_content" data-tab-content="01"></div>
          <div class="tab_content" data-tab-content="02"></div>
          <div class="tab_content" data-tab-content="03"></div>
          <div class="tab_content" data-tab-content="04"></div>
          <div class="tab_content" data-tab-content="05"></div>
        </div>
      </div>
    </div>

    <!-- 네비게이션 컴포넌트 -->
    <div id="compNav"></div>
  </body>
</html>
